name: mobile_app
publish_to: none

description: Mobile app prototype for Alif School students and parents.
version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  http: ^1.2.2
  cupertino_icons: ^1.0.8
  google_fonts: ^6.2.1
  supabase_flutter: ^2.8.4
  provider: ^6.1.2
  # Phase S student-portal additions (June 30, 2026):
  #  fl_chart      — progress charts (S2 weekly heatmap / monthly bar).
  #  share_plus    — share earned badge (S4).
  #  firebase_core + firebase_messaging — FCM push (S6).
  #  hive + hive_flutter — offline cache of activities/logs/leaderboard (S6).
  fl_chart: ^0.69.2
  share_plus: ^10.1.2
  firebase_core: ^3.12.1
  firebase_messaging: ^15.2.4
  hive: ^2.2.3
  hive_flutter: ^1.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
